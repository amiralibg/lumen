[package]
name = "lumen-app"
description = "winit window and event loop for lumen (native and web)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lumen-core.workspace = true
lumen-wgpu.workspace = true
wgpu.workspace = true
winit.workspace = true
log.workspace = true
web-time.workspace = true
png.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
# Screen readers: VoiceOver, Narrator/NVDA (UIA), Orca (AT-SPI).
accesskit_winit = "0.33.2"
lumen-core = { workspace = true, features = ["accesskit"] }
env_logger.workspace = true
arboard.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSColor", "NSColorSpace", "NSWorkspace", "NSAccessibility", "objc2-core-foundation", "NSView", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSUserDefaults", "NSString"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "CssStyleDeclaration", "MediaQueryList"] }
console_error_panic_hook.workspace = true
console_log.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSWindow", "NSApplication", "NSResponder", "NSGraphicsContext", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSArray", "NSString", "NSProcessInfo", "NSRunLoop", "NSDate", "NSObjCRuntime"] }
