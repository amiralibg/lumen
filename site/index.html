    // Theme and accent before first paint, to avoid a flash.
    (function () {
      var s = {};
      try { s = JSON.parse(localStorage.getItem("lumen-site") || "{}"); } catch (e) {}
      var t = s.theme || "system";
      var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      var r = document.documentElement;
      r.classList.add(dark ? "t-dark" : "t-light");
      if (s.accentHex) r.style.setProperty("--accent", s.accentHex);
    })();
  </script>
