[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lumen-ui/lumen"

[workspace.dependencies]
lumen-text = { path = "crates/lumen-text", version = "0.1.0" }
lumen-core = { path = "crates/lumen-core", version = "0.1.0" }
lumen-wgpu = { path = "crates/lumen-wgpu", version = "0.1.0" }
lumen-app = { path = "crates/lumen-app", version = "0.1.0" }
lumen = { path = "crates/lumen", version = "0.1.0" }

cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
ahash = { version = "0.8", default-features = false, features = ["std"] }
unicode-segmentation = "1.12"
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12", "gles", "webgpu", "webgl", "std"] }
bytemuck = { version = "1.25", features = ["derive"] }
winit = "0.30.13"
pollster = "1"
web-time = "1.1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
png = "0.18"
arboard = { version = "3.7", default-features = false }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1.1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.release-web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
